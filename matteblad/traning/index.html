<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Träna inför provet</title>
<style>
  /* Same look as the stjärnbläck practice (uppstallning/), but a wrong answer is blue, never red (Peter 2026-11-19) */
  :root { --blue: #2a75bb; --green: #3f9a3a; --ink: #1d1d1f; --line: #c9d6e6; --soft: #d6e8fb; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f3f6fa; color: var(--ink); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
  .back { color: var(--blue); text-decoration: none; font-weight: 600; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 8px 0 18px; }
  h1 { margin: 0; color: var(--blue); font-size: 32px; }
  .progress { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #555; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #d5dde7; }
  .dot.done { background: var(--green); }
  .dot.now { background: #fff; box-shadow: inset 0 0 0 3px var(--blue); }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; }
  .hidden { display: none !important; }

  /* Choosing what to practise */
  .lead { font-size: 22px; font-weight: 600; margin: 0 0 16px; }
  .sorts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .sort { font: inherit; text-align: left; padding: 18px 20px; border-radius: 14px; border: 2px solid var(--line); background: #f7f9fc;
          cursor: pointer; display: flex; flex-direction: column; gap: 6px; touch-action: manipulation; transition: transform .15s; }
  .sort b { font-size: 22px; color: var(--blue); }
  .sort span { font-size: 17px; color: #555; font-variant-numeric: tabular-nums; }
  .sort:hover, .sort:focus-visible { border-color: var(--blue); transform: translateY(-2px); outline: none; }
  .sort:active { transform: scale(.97); }
  .sort.mix { background: #eef7ee; border-color: #b9dcb6; }
  .sort.mix b { color: var(--green); }

  /* Game: the task on the left, thought bubble and answer on the right */
  .game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 28px; align-items: start; }
  .left { display: flex; flex-direction: column; align-items: stretch; gap: 12px; min-width: 0; }
  .task-title { font-size: 22px; font-weight: 600; color: #555; text-align: center; }
  .paper { background-color: #fff; border: 1px solid #dde7f2; border-radius: 10px; padding: 28px 22px; min-height: 240px;
           background-image: linear-gradient(#dde7f2 1px, transparent 1px), linear-gradient(90deg, #dde7f2 1px, transparent 1px);
           background-size: 32px 32px; }
  .expr { text-align: center; font-size: 46px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .expr .res { display: inline-block; min-width: 1.4em; padding: 0 .15em; border-radius: 10px; color: #b3bfcc; }
  .expr .res.win { color: var(--green); background: #e9f6e8; }
  .trail { list-style: none; margin: 22px auto 0; padding: 0; display: grid; gap: 8px; max-width: 420px; }
  .trail li { font-size: 20px; line-height: 1.35; padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,.92);
              font-variant-numeric: tabular-nums; }
  .trail li.open { background: var(--soft); font-weight: 600; }
  .trail li.ok { color: var(--green); }
  .trail li.ok::before { content: "✓ "; font-weight: 700; }
  .change { align-self: center; font: inherit; font-size: 16px; color: var(--blue); background: none; border: 0; cursor: pointer; text-decoration: underline; }
  .pop { display: inline-block; animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.18); opacity: 1; } 100% { transform: scale(1); } }

  .right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .bubble { position: relative; background: #f7f9fc; border: 2px solid var(--line); border-radius: 26px; padding: 14px 20px 16px; min-height: 130px; }
  .puff { position: absolute; background: #f7f9fc; border: 2px solid var(--line); border-radius: 50%; }
  .p1 { width: 20px; height: 20px; left: -30px; top: 44px; }
  .p2 { width: 11px; height: 11px; left: -48px; top: 62px; }
  .think { font-size: 13px; color: #7a8796; margin-bottom: 4px; }
  .line { font-size: 19px; line-height: 1.45; }
  .line.q { font-weight: 600; }
  .line.ok { color: var(--green); font-weight: 600; }
  .line.no { color: var(--blue); font-weight: 600; }
  .line.tip { color: #8a6a00; font-size: 16px; margin-top: 2px; }

  .answer { height: 72px; border: 3px solid var(--blue); border-radius: 14px; background: #fff; display: flex; align-items: center;
            justify-content: center; font-size: 44px; font-weight: 600; color: var(--blue); font-variant-numeric: tabular-nums; }
  .answer.empty::after { content: "?"; color: #c3ccd7; }
  .shake { animation: shake .35s; background: var(--soft); }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button, .big { font: inherit; font-size: 26px; font-weight: 600; min-height: 60px; border-radius: 14px;
          border: 2px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; touch-action: manipulation; }
  .pad button:hover { border-color: var(--blue); }
  .pad button:active, .big:active { transform: scale(.96); }
  .pad .comma { font-size: 34px; line-height: 1; }
  .pad .del { color: #666; }
  .pad .help { background: #fff8dc; border-color: #e5cf7a; color: #8a6a00; font-size: 22px; }
  .pad .help:disabled { background: #f4f5f7; border-color: #e1e5ea; color: #aab4c0; cursor: default; }
  .pad .ok { grid-column: span 2; background: var(--green); border-color: var(--green); color: #fff; font-size: 22px; }
  .big { width: 100%; min-height: 68px; background: var(--green); border-color: var(--green); color: #fff; }

  /* Summary after five tasks */
  .summary { text-align: center; padding: 28px 20px; }
  .summary h2 { color: var(--green); font-size: 30px; margin: 0 0 8px; }
  .score { font-size: 20px; margin: 0 0 18px; }
  .list { list-style: none; padding: 0; margin: 0 auto 24px; max-width: 420px; text-align: left; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #e6ecf3; font-size: 19px;
             font-variant-numeric: tabular-nums; }
  .list .miss { color: #8a96a3; font-size: 15px; align-self: center; text-align: right; }
  .more { font-size: 22px; font-weight: 600; margin: 0 0 14px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .actions a, .actions button { padding: 14px 24px; border-radius: 999px; font: inherit; font-weight: 600; font-size: 18px; text-decoration: none;
          border: 2px solid var(--blue); color: var(--blue); background: #fff; cursor: pointer; }
  .actions .primary { background: var(--green); border-color: var(--green); color: #fff; }

  @media (max-width: 760px) {
    .game { grid-template-columns: 1fr; gap: 46px; }
    .p1 { left: 56px; top: -28px; }
    .p2 { left: 42px; top: -44px; }
    .paper { min-height: 0; }
  }
  @media (max-width: 420px) {
    .card { padding: 14px; }
    h1 { font-size: 26px; }
    .expr { font-size: 36px; }
    .trail li { font-size: 18px; }
    .pad button { min-height: 52px; }
    .answer { height: 60px; font-size: 38px; }
  }
</style>
<style>
  .lassida.unlocked { display: contents; }
  .las-vakt { max-width: 520px; margin: 48px auto; padding: 0 16px; font-family: "Segoe UI", Arial, sans-serif; text-align: center; }
  .las-vakt h1 { margin: 0 0 4px; }
  .las-vakt .vakt-sub { margin: 0 0 20px; color: #666; }
</style>
