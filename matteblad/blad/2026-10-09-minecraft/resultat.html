<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f3f6fa; color: #1d1d1f; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  .back { color: #3c8527; font-weight: 600; text-decoration: none; }
  h1 { margin: 12px 0 4px; color: #3c8527; font-size: 28px; }
  .sub { margin: 0 0 20px; color: #666; }
  .summary { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center;
             background: #fff; border-radius: 16px; padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
             border-top: 6px solid #5e3d22; }
  .score { font-size: 40px; font-weight: 800; margin: 0; }
  .score small { font-size: 20px; font-weight: 600; color: #666; }
  .message { margin: 6px 0 0; font-size: 18px; }  h2 { margin: 28px 0 12px; font-size: 20px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .error { background: #fff; border-radius: 14px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
           border-left: 6px solid #3c8527; }
  .task { font-weight: 700; color: #3c8527; }
  .q { font-size: 18px; margin: 4px 0 8px; }
  .answers { display: flex; gap: 24px; flex-wrap: wrap; font-size: 18px; }
  .answers s { color: #b3261e; }
  .answers .right b { color: #2e7d32; font-size: 22px; }
  .tip { margin: 10px 0 0; color: #333; }
  .allright { background: #fff; border-radius: 14px; padding: 16px 20px; font-size: 18px; }
  .facit { display: inline-block; margin-top: 24px; padding: 12px 20px; border-radius: 999px; background: #3c8527;
           color: #fff; text-decoration: none; font-weight: 600; }
  
  .prize { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px;
           border-radius: 14px; text-decoration: none; color: #1d1d1f;
           border: 5px solid transparent;
           background: linear-gradient(#fff, #fff) padding-box,
                       linear-gradient(135deg, #fff3a8 0%, #d4a72c 25%, #fff1a0 50%, #b8860b 75%, #f6dc72 100%) border-box;
           box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px #d4a72c, 0 2px 10px rgba(184, 134, 11, .35); }
  .prize .level { background: var(--prize); color: #fff; font-weight: 700; font-size: 12px; padding: 2px 10px;
                  border-radius: 999px; text-transform: uppercase; letter-spacing: .5px; }
  /* Fixed slots for picture and name, so the box keeps its size when the ball is opened. */
  .prize .art { display: flex; align-items: center; justify-content: center; }
  .prize.small .art { width: 80px; height: 68px; }
  .prize.large .art { width: 110px; height: 100px; }
  .prize img { image-rendering: pixelated; }
  .prize.small .ballimg { width: 56px; height: 56px; }
  .prize.large .ballimg { width: 96px; height: 96px; }
  .prize .pokeimg { display: none; width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
  .prize .pokeimg[src$=".svg"] { image-rendering: pixelated; }
  .prize .name { font-weight: 700; height: 20px; line-height: 20px; white-space: nowrap; }
  .prize.large .name { font-size: 20px; height: 26px; line-height: 26px; }
  .prize.secret .name { visibility: hidden; }
  .prize.secret.opened .name { visibility: visible; }
  .prize.secret.opened .ballimg { display: none; }
  .prize.secret.opened .pokeimg { display: block; }
  /* Unopened prize: a light band travels around the gold frame and the glow pulses. */
  .prize.secret:not(.opened) { background: linear-gradient(#fff, #fff) padding-box,
                       linear-gradient(110deg, #b8860b 0%, #d4a72c 30%, #fff3b0 43%, #ffffff 50%, #fff3b0 57%, #d4a72c 70%, #b8860b 100%) border-box;
           background-size: 100% 100%, 300% 100%;
           animation: goldshine 2.2s linear infinite, goldglow 2.2s ease-in-out infinite; }
  @keyframes goldshine { from { background-position: 0 0, 100% 0; } to { background-position: 0 0, 0% 0; } }
  @keyframes goldglow {
    50% { box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px #d4a72c, 0 0 18px 2px rgba(255, 196, 30, .8); }
  }
  @media (prefers-reduced-motion: reduce) { .prize { animation: none !important; } }
  
  .reveal { font: inherit; color: #1d1d1f; cursor: pointer; width: 220px; padding: 10px 10px 12px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            border-radius: 14px; border: 5px solid transparent;
           background: linear-gradient(#fff, #fff) padding-box,
                       linear-gradient(135deg, #fff3a8 0%, #d4a72c 25%, #fff1a0 50%, #b8860b 75%, #f6dc72 100%) border-box;
           box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px #d4a72c, 0 2px 10px rgba(184, 134, 11, .35); }
  .reveal .level { background: var(--prize); color: #fff; font-weight: 700; font-size: 12px; padding: 2px 10px;
                   border-radius: 999px; text-transform: uppercase; letter-spacing: .5px; }
  .reveal .stage { position: relative; width: 190px; height: 170px; }
  .reveal .ball { position: absolute; left: 45px; top: 35px; width: 100px; height: 100px; transform-origin: 50% 100%;
                  transition: transform .2s; }
  .reveal .ball svg { width: 100%; height: 100%; overflow: visible; }
  .reveal .lid { transform-box: view-box; transform-origin: 6px 50px; }
  .reveal[data-typ="kista"] .lid { transform-origin: 1px 7px; }
  .reveal[data-typ="kista"] .poke { image-rendering: pixelated; }
  .reveal[data-typ="dagbok"] .lid { transform-origin: 14px 50px; }
  .reveal[data-typ="dagbok"].open .lid { animation-name: coverflip; }
  /* Halfway through the flip the front of the cover is hidden and its light inside shows. */
  .reveal[data-typ="dagbok"].open .lid .front { animation: coverfront .2s linear 1.25s forwards; }
  .reveal[data-typ="dagbok"].open .lid .inside { animation: coverinside .2s linear 1.25s forwards; }
  @keyframes coverflip { to { transform: scaleX(-1); } }
  @keyframes coverfront { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes coverinside { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
  .reveal .poke { position: absolute; left: 20px; top: 0; width: 150px; height: 150px; opacity: 0; transform: scale(0); }
  .reveal .flash { position: absolute; left: 75px; top: 65px; width: 40px; height: 40px; border-radius: 50%; opacity: 0;
                   background: radial-gradient(circle, #fff 0%, #fff8c8 40%, rgba(255,255,255,0) 70%); }
  /* Stars start at the centre of the ball. Size, colour, angle and distance come from --s, --c, --a and --d. */
  .reveal .spark { position: absolute; z-index: 2; left: 95px; top: 85px; width: var(--s); height: var(--s);
                   margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); font-size: var(--s); line-height: var(--s);
                   text-align: center; color: var(--c); opacity: 0; pointer-events: none;
                   text-shadow: 0 0 4px #d4a72c, 0 0 12px #ffd23f; }
  .reveal .caption { height: 32px; display: flex; align-items: center; justify-content: center; }
  .reveal .hint { font-weight: 700; color: var(--prize); animation: pulse 1.2s ease-in-out infinite; }
  .reveal .name { display: none; font-weight: 700; font-size: 22px; line-height: 32px; }
  .reveal:hover .ball { transform: rotate(-6deg); }

  .reveal.open .hint { display: none; }
  .reveal.open .name { display: block; animation: fadein .4s ease-out 1.8s both; }
  .reveal.open .ball { animation: shake 1.2s ease-in-out, away .4s ease-in 1.55s forwards; }
  .reveal.open .lid { animation: lidopen .2s cubic-bezier(.2, .9, .3, 1.2) 1.25s forwards; }
  .reveal.open .flash { animation: flash .5s ease-out 1.3s forwards; }
  .reveal.open .spark { animation: spark .6s cubic-bezier(.1, .9, .2, 1) 1.3s forwards; }
  .reveal.open .poke { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) 1.35s forwards; }
  .reveal.noimg .poke { display: none; }
  .reveal.shown * { animation-duration: 0s !important; animation-delay: 0s !important; }

  /* Closed and while the ball shakes (.charging): the gold frame shines. At the bang (.bang, set by the
     script 1.3 s after the click) the frame shakes once and then stands still. */
  .reveal:not(.open), .reveal.charging { background: linear-gradient(#fff, #fff) padding-box,
                       linear-gradient(110deg, #b8860b 0%, #d4a72c 30%, #fff3b0 43%, #ffffff 50%, #fff3b0 57%, #d4a72c 70%, #b8860b 100%) border-box;
           background-size: 100% 100%, 300% 100%;
           animation: goldshine 2.2s linear infinite, goldglow 2.2s ease-in-out infinite; }
  .reveal.bang { animation: frameshake .45s ease-in-out; }
  @keyframes frameshake {
    0%, 100% { transform: none; }
    15% { transform: translateX(-5px) rotate(-2.5deg); }
    35% { transform: translateX(5px) rotate(2.5deg); box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px #d4a72c, 0 0 26px 4px rgba(255, 196, 30, .9); }
    55% { transform: translateX(-3px) rotate(-1.5deg); }
    75% { transform: translateX(2px) rotate(1deg); }
  }

  @keyframes pulse { 50% { opacity: .55; } }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
  @keyframes shake {
    0%, 30%, 65%, 100% { transform: rotate(0); }
    10%, 45%, 80% { transform: rotate(-16deg); }
    20%, 55%, 90% { transform: rotate(16deg); }
  }
  @keyframes away { to { transform: translate(-64px, 30px) scale(.35); } }
  @keyframes lidopen { to { transform: rotate(-65deg); } }
  @keyframes flash { 0% { opacity: 0; transform: scale(.5); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(6); } }
  @keyframes spark {
    0% { opacity: 1; transform: rotate(var(--a)) translateY(0) scale(.3); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(1); }
  }
  @keyframes pop { from { opacity: 0; transform: translateY(50px) scale(0); } to { opacity: 1; transform: translateY(-6px) scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    .reveal.open * { animation-duration: .01s !important; animation-delay: 0s !important; }
    .reveal, .reveal .hint { animation: none !important; }
  }
  @media (max-width: 560px) { .summary { grid-template-columns: 1fr; justify-items: start; } }
</style>

    const open = () => {
      el.classList.add("open", "charging");
      timer = setTimeout(() => el.classList.replace("charging", "bang"), BANG_MS);
    };
    const close = () => el.classList.remove("open", "shown", "charging", "bang");

    let stored = false;
    try { stored = localStorage.getItem(key) === "open"; } catch {}
    if (location.hash === "#oppen") open();
    else if (stored) el.classList.add("open", "shown");

    el.addEventListener("click", () => {
      clearTimeout(timer);
      const opening = !el.classList.contains("open");
      close();
      if (opening) open();
      try { opening ? localStorage.setItem(key, "open") : localStorage.removeItem(key); } catch {}
    });
  });
  }
  document.addEventListener("las:unlocked", initReveal);
</script>
</body>
</html>
