<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Matteblad</title>
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f3f6fa; color: #1d1d1f; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; color: #2a75bb; font-size: 32px; }
  .intro { margin: 0 0 24px; color: #555; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
  .card { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
          background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .card h2 { margin: 0; font-size: 20px; }
  .card p { margin: 4px 0 0; color: #444; }
  .card .date { color: #888; font-size: 14px; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  .links a { padding: 10px 16px; border-radius: 999px; border: 2px solid #2a75bb; color: #2a75bb;
             text-decoration: none; font-weight: 600; }
  .links a.primary { background: #3f9a3a; border-color: #3f9a3a; color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Matteblad</h1>
  <p class="intro">Välj ett blad. Allt du skriver sparas på datorn du använder. Tryck på "Klar! Spara som PDF" när du är färdig och skicka filen hem.</p>
  <ul>
    <li class="card">
      <div>
        <h2>Pokémon-matte, blad 1</h2>
        <p>Blad 1: Stora tal och de fyra räknesätten</p>
        <p class="date">8 oktober 2026</p>
      </div>
      <div class="links">
        <a class="primary" href="blad/2026-10-08-pokemon/blad.html">Öppna och fyll i</a>
        <a href="blad/2026-10-08-pokemon/blad.pdf">PDF för utskrift</a>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
